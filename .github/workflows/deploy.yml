# Builds the site and publishes it to GitHub Pages on every push to master.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway, but skip queued ones that are already outdated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
