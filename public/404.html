<!doctype html>
<!-- GitHub Pages serves this for any unknown URL. Kept dependency-free on purpose. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Kelvin</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #0a0d12;
        --surface: #121722;
        --ink: #e7eaf0;
        --muted: #949cad;
        --line: #242b39;
        --accent: #5cc8f5;
        --on-accent: #06141c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafbfc;
          --surface: #ffffff;
          --ink: #0e131b;
          --muted: #586273;
          --line: #e1e5eb;
          --accent: #0a6fa3;
          --on-accent: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
        width: 100%;
        padding: 3rem 2rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
      }
      .code {
        margin: 0;
        color: var(--accent);
        font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 0.75rem 0;
        font-size: 1.9rem;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        filter: brightness(1.1);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>This page doesn’t exist, or it has moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
