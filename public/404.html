<!doctype html>
<!-- GitHub Pages serves this for any unknown URL. Kept dependency-free on purpose. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Game over · Kelvinice</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #0b1020;
        --surface: #131c38;
        --ink: #e8f1ff;
        --muted: #93a6cc;
        --line: #2b3c6e;
        --ice: #5ee7ff;
        --pink: #ff7ac6;
        --shadow: #04070f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef5ff;
          --surface: #ffffff;
          --ink: #0f1a33;
          --muted: #4a5c80;
          --line: #a9bfe3;
          --ice: #0072a3;
          --pink: #c2187a;
          --shadow: #0f1a33;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
        text-align: center;
      }
      main {
        max-width: 32rem;
        width: 100%;
        padding: 3rem 1.5rem;
        background: var(--surface);
        border: 3px solid var(--line);
        box-shadow: 6px 6px 0 var(--shadow);
      }
      .code {
        margin: 0;
        color: var(--pink);
        letter-spacing: 0.3em;
        font-size: 0.8rem;
      }
      h1 {
        margin: 1rem 0;
        font-size: clamp(2rem, 9vw, 3.25rem);
        color: var(--ice);
        letter-spacing: 0.08em;
        text-shadow: 3px 3px 0 var(--shadow);
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.9rem 1.4rem;
        background: var(--ice);
        color: var(--bg);
        font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border: 3px solid var(--shadow);
        box-shadow: 4px 4px 0 var(--shadow);
      }
      a:hover {
        background: var(--pink);
      }
      a:active {
        transform: translate(4px, 4px);
        box-shadow: none;
      }
      .blink {
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .blink {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR 404</p>
      <h1>GAME OVER</h1>
      <p>This level doesn’t exist, or it moved somewhere else.</p>
      <p>Continue? <span class="blink">9</span></p>
      <a href="/">▶ Back to start</a>
    </main>
  </body>
</html>
