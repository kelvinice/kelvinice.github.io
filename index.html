<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kelvin · Software Engineer & Full-stack Web Developer, Jakarta</title>
    <meta
      name="description"
      content="Kelvin is a web developer and software engineer in Jakarta with 8+ years of experience designing, building and testing production web systems."
    />
    <meta name="author" content="Kelvin" />
    <link rel="canonical" href="https://kelvinice.github.io/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kelvin · Software Engineer" />
    <meta property="og:url" content="https://kelvinice.github.io/" />
    <meta property="og:title" content="Kelvin · Software Engineer & Full-stack Web Developer" />
    <meta
      property="og:description"
      content="Web developer and software engineer with 8+ years of experience designing, building and testing production systems."
    />
    <meta property="og:image" content="https://kelvinice.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kelvin",
        "alternateName": "Kelvinice",
        "jobTitle": "Software Engineer",
        "description": "Web developer and software engineer with 8+ years of experience.",
        "url": "https://kelvinice.github.io/",
        "email": "mailto:kelvinices@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Jakarta",
          "addressCountry": "ID"
        },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Bina Nusantara University" },
        "knowsAbout": [
          "Web development",
          "Software engineering",
          "Scrum",
          "Laravel",
          "NestJS",
          "React",
          "Next.js",
          "Test automation"
        ],
        "sameAs": ["https://github.com/kelvinice", "https://www.linkedin.com/in/kelvin-007-/"]
      }
    </script>

    <!-- Apply the saved / system theme before first paint to avoid a flash. -->
    <script>
      try {
        const saved = localStorage.getItem('theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Kelvin, Software Engineer. This site needs JavaScript; you can reach me at
        <a href="mailto:kelvinices@gmail.com">kelvinices@gmail.com</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
